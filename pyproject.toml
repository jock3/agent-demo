[project]
name = "agent-demo"
version = "0.1.0"
description = "Tool-use agent over the Sundets Rosteri knowledge base"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.69",
    "python-dotenv>=1.0",
]

[project.scripts]
agent-demo = "agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]
